<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <style>
      .box   { stroke-width: 2; rx: 10; }
      .title { font-size: 15px; font-weight: 700; fill: #111827; }
      .sub   { font-size: 12.5px; fill: #4b5563; }
      .mono  { font-size: 12px; fill: #374151; font-family: 'SF Mono', Menlo, Consolas, monospace; }
      .edge  { stroke: #4b5563; stroke-width: 2; fill: none; }
      .muted { stroke: #9ca3af; stroke-width: 1.8; fill: none; stroke-dasharray: 6 5; }
      .note  { font-size: 12px; fill: #6b7280; font-style: italic; }
    </style>
  </defs>

  <rect width="1200" height="560" fill="#ffffff"/>

  <!-- loop-prevention path: fix -> CloudTrail -->
  <path class="muted" d="M1100,90 V40 H265 V158" marker-end="url(#arrow-muted)"/>
  <text class="note" x="682" y="32" text-anchor="middle">the fix emits its own CloudTrail event, which the detection sees as benign, so there is no loop</text>

  <!-- actor -->
  <rect class="box" x="12" y="170" width="146" height="70" fill="#f3f4f6" stroke="#6b7280"/>
  <text class="title" x="85" y="200" text-anchor="middle">Risky change</text>
  <text class="sub" x="85" y="220" text-anchor="middle">console, CLI, SDK</text>

  <!-- CloudTrail -->
  <rect class="box" x="190" y="160" width="150" height="90" fill="#fdf2f8" stroke="#db2777"/>
  <text class="title" x="265" y="192" text-anchor="middle">CloudTrail</text>
  <text class="sub" x="265" y="212" text-anchor="middle">management events</text>
  <text class="sub" x="265" y="230" text-anchor="middle">multi-region trail</text>

  <!-- EventBridge -->
  <rect class="box" x="380" y="130" width="180" height="150" fill="#fdf2f8" stroke="#db2777"/>
  <text class="title" x="470" y="160" text-anchor="middle">EventBridge</text>
  <text class="sub" x="470" y="180" text-anchor="middle">default bus, us-east-1</text>
  <text class="mono" x="400" y="210">s3-public-access</text>
  <text class="mono" x="400" y="232">iam-privesc</text>
  <text class="mono" x="400" y="254">sg-open</text>

  <!-- SQS -->
  <rect class="box" x="600" y="160" width="150" height="90" fill="#fdf2f8" stroke="#db2777"/>
  <text class="title" x="675" y="192" text-anchor="middle">SQS queue</text>
  <text class="sub" x="675" y="212" text-anchor="middle">only EventBridge</text>
  <text class="sub" x="675" y="230" text-anchor="middle">can send to it</text>

  <!-- DLQ -->
  <rect class="box" x="585" y="330" width="180" height="70" fill="#fef2f2" stroke="#dc2626"/>
  <text class="title" x="675" y="360" text-anchor="middle">Dead-letter queue</text>
  <text class="sub" x="675" y="380" text-anchor="middle">after 3 failed tries</text>

  <!-- Lambda -->
  <rect class="box" x="790" y="110" width="190" height="190" fill="#fff7ed" stroke="#ea580c"/>
  <text class="title" x="885" y="140" text-anchor="middle">Lambda (Python)</text>
  <text class="sub" x="885" y="160" text-anchor="middle">one shared handler</text>
  <text class="mono" x="808" y="190">s3_public</text>
  <text class="sub" x="962" y="190" text-anchor="end">T1530</text>
  <text class="mono" x="808" y="212">iam_privesc</text>
  <text class="sub" x="962" y="212" text-anchor="end">T1098</text>
  <text class="mono" x="808" y="234">sg_open</text>
  <text class="sub" x="962" y="234" text-anchor="end">T1562.007</text>
  <text class="sub" x="885" y="266" text-anchor="middle">allowlist, dry-run,</text>
  <text class="sub" x="885" y="284" text-anchor="middle">idempotent findings</text>

  <!-- outputs -->
  <rect class="box" x="1010" y="90" width="180" height="70" fill="#f0fdf4" stroke="#16a34a"/>
  <text class="title" x="1100" y="120" text-anchor="middle">Revert the change</text>
  <text class="sub" x="1100" y="140" text-anchor="middle">S3, IAM, EC2 APIs</text>

  <rect class="box" x="1010" y="190" width="180" height="70" fill="#eff6ff" stroke="#2563eb"/>
  <text class="title" x="1100" y="220" text-anchor="middle">DynamoDB</text>
  <text class="sub" x="1100" y="240" text-anchor="middle">findings, time to fix</text>

  <rect class="box" x="1010" y="290" width="180" height="70" fill="#fdf2f8" stroke="#db2777"/>
  <text class="title" x="1100" y="320" text-anchor="middle">SNS</text>
  <text class="sub" x="1100" y="340" text-anchor="middle">email alert</text>

  <!-- main flow -->
  <path class="edge" d="M158,205 H188" marker-end="url(#arrow)"/>
  <path class="edge" d="M340,205 H378" marker-end="url(#arrow)"/>
  <path class="edge" d="M560,205 H598" marker-end="url(#arrow)"/>
  <path class="edge" d="M750,205 H788" marker-end="url(#arrow)"/>
  <path class="muted" d="M675,250 V328" marker-end="url(#arrow-muted)"/>
  <text class="note" x="685" y="295">retries</text>

  <!-- Lambda to outputs -->
  <path class="edge" d="M980,160 C1000,160 1000,125 1008,125" marker-end="url(#arrow)"/>
  <path class="edge" d="M980,225 H1008" marker-end="url(#arrow)"/>
  <path class="edge" d="M980,270 C1000,270 1000,325 1008,325" marker-end="url(#arrow)"/>

  <!-- footer -->
  <rect x="20" y="440" width="1160" height="96" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
  <text class="title" x="40" y="470">Deployed with Terraform</text>
  <text class="sub" x="40" y="494">Least-privilege Lambda role with one policy per detection. IAM permissions are remove-only (detach, delete, deactivate), so the role cannot grant access.</text>
  <text class="sub" x="40" y="516">Median time from change to fix over 30 runs: IAM 2.9 s, security group 4.4 s, S3 9.5 s. The pipeline's own share is under 0.6 s; the rest is CloudTrail delivery.</text>
</svg>
